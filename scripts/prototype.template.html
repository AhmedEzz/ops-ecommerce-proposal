<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPS Management System — Clickable Prototype</title>
<style>
:root{
  --brand:#4f46e5; --brand-dk:#3730a3; --brand-lt:#eef2ff;
  --ink:#0f172a; --ink-2:#334155; --ink-3:#64748b; --ink-4:#94a3b8;
  --bg:#f1f5f9; --card:#ffffff; --line:#e2e8f0;
  --ok:#059669; --ok-bg:#ecfdf5; --warn:#d97706; --warn-bg:#fffbeb;
  --bad:#dc2626; --bad-bg:#fef2f2; --info:#0284c7; --info-bg:#f0f9ff;
  --p1:#4f46e5; --p1b:#7c3aed; --p2:#64748b;
  --sidebar:#111827; --sidebar-2:#1f2937;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--brand);text-decoration:none}
table{border-collapse:collapse;width:100%}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--sidebar);color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:18px 18px 14px;border-bottom:1px solid #1f2937}
.brand h1{font-size:15px;color:#fff;font-weight:700;letter-spacing:-.2px}
.brand p{font-size:11px;color:#64748b;margin-top:2px}
.roles{padding:12px 14px;border-bottom:1px solid #1f2937}
.roles .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin-bottom:6px}
.rolebtns{display:flex;gap:4px;background:var(--sidebar-2);padding:3px;border-radius:7px}
.rolebtns button{flex:1;padding:6px 4px;font-size:11px;font-weight:600;border-radius:5px;color:#94a3b8;transition:.12s}
.rolebtns button.on{background:var(--brand);color:#fff}
nav{padding:10px 0;flex:1}
nav .grp{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;padding:12px 18px 5px;font-weight:700}
nav a{display:flex;align-items:center;gap:9px;padding:8px 18px;color:#cbd5e1;font-size:13px;border-left:2px solid transparent}
nav a:hover{background:var(--sidebar-2);color:#fff}
nav a.on{background:var(--sidebar-2);color:#fff;border-left-color:var(--brand);font-weight:600}
nav a .ic{width:15px;text-align:center;opacity:.85;font-size:13px}
.sidefoot{padding:12px 18px;border-top:1px solid #1f2937;font-size:10px;color:#4b5563}

main{min-width:0;padding:22px 26px 60px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.top h2{font-size:21px;font-weight:700;letter-spacing:-.3px}
.top .sub{color:var(--ink-3);font-size:13px;margin-top:3px;max-width:70ch}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* ---------- badges ---------- */
.req{display:inline-block;font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px;background:var(--brand-lt);color:var(--brand-dk);letter-spacing:.02em}
.ph{display:inline-block;font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px;color:#fff}
.ph.p1{background:var(--p1)} .ph.p1b{background:var(--p1b)} .ph.p2{background:var(--p2)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.mute{background:#f1f5f9;color:var(--ink-3)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
.card > h3{font-size:13px;font-weight:700;padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.card > h3 .note{font-weight:400;color:var(--ink-3);font-size:12px}
.card .body{padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .k{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .v{font-size:25px;font-weight:700;letter-spacing:-.5px;margin:5px 0 2px}
.kpi .d{font-size:11px;color:var(--ink-4)}
.kpi.ok .v{color:var(--ok)} .kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
th{background:#f8fafc;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);
   text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700}
td{padding:9px 11px;border-bottom:1px solid #f1f5f9;font-size:13px;white-space:nowrap}
tbody tr:hover{background:#fafbfc}
tr.clk{cursor:pointer}
tr.clk:hover{background:var(--brand-lt)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.trunc{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}

/* ---------- filters ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:#fafbfc;align-items:center}
.filters select,.filters input{padding:6px 9px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:12px;background:#fff;color:var(--ink)}
.filters input{min-width:180px}
.filters .n{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:600}
.btn{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;background:var(--brand);color:#fff}
.btn:hover{background:var(--brand-dk)}
.btn.g{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
.btn.g:hover{background:#f8fafc}
.btn.sm{padding:4px 9px;font-size:11px}

/* ---------- misc ---------- */
.note{background:var(--info-bg);border-left:3px solid var(--info);padding:11px 14px;border-radius:0 7px 7px 0;font-size:12.5px;color:var(--ink-2);margin-bottom:14px}
.note.w{background:var(--warn-bg);border-left-color:var(--warn)}
.note.d{background:var(--bad-bg);border-left-color:var(--bad)}
.note.g{background:var(--ok-bg);border-left-color:var(--ok)}
.note b{color:var(--ink)}
.bar{height:7px;background:#f1f5f9;border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.flow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11px}
.flow .st{padding:4px 9px;border-radius:5px;background:#f1f5f9;color:var(--ink-3);font-weight:600;white-space:nowrap}
.flow .st.done{background:var(--ok-bg);color:var(--ok)}
.flow .st.now{background:var(--brand);color:#fff}
.flow .ar{color:var(--ink-4)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13px}
dl.kv dt{color:var(--ink-3);font-weight:600}
dl.kv dd{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:32px;text-align:center;color:var(--ink-4);font-size:13px}
.demo{background:#fffbeb;border:1px dashed #f59e0b;color:#78350f;padding:8px 12px;border-radius:7px;font-size:12px;margin-bottom:14px}

/* ---------- public portal ---------- */
.pub{max-width:620px;margin:36px auto;padding:0 18px}
.pub .card{box-shadow:0 1px 3px rgba(0,0,0,.06)}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:13px}
.opt{border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:8px;cursor:pointer;display:flex;gap:11px;align-items:flex-start}
.opt:hover{border-color:var(--brand);background:var(--brand-lt)}
.opt.on{border-color:var(--brand);background:var(--brand-lt);box-shadow:0 0 0 1px var(--brand)}
.opt .t{font-weight:600;font-size:13px}
.opt .s{font-size:12px;color:var(--ink-3);margin-top:2px}

/* ---------- signed-in identity block ---------- */
.who{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid #1f2937}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:flex;
        align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:0 0 auto}
.whoTxt{min-width:0;flex:1}
.whoTxt .nm{font-size:12.5px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.whoTxt .rl{font-size:10.5px;color:#64748b}
#signout{color:#64748b;font-size:15px;padding:4px 6px;border-radius:5px}
#signout:hover{background:var(--sidebar-2);color:#f87171}

/* ---------- login ---------- */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px;
      background:linear-gradient(160deg,#111827 0%,#1e293b 55%,#312e81 100%)}
.authbox{width:100%;max-width:940px;display:grid;grid-template-columns:1fr 1fr;gap:0;
         background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.authL{padding:34px 32px}
.authR{padding:34px 30px;background:#f8fafc;border-left:1px solid var(--line)}
.authBrand h1{font-size:19px;font-weight:700;letter-spacing:-.3px}
.authBrand p{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.authBrand{margin-bottom:24px}
.authL h2{font-size:15px;font-weight:700;margin-bottom:3px}
.authL .hint{font-size:12.5px;color:var(--ink-3);margin-bottom:18px}
.authR h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:4px}
.authR .sub2{font-size:12px;color:var(--ink-3);margin-bottom:14px}
.rolecard{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;
          border:1px solid var(--line);border-radius:9px;background:#fff;margin-bottom:7px;transition:.12s}
.rolecard:hover{border-color:var(--brand);background:var(--brand-lt);transform:translateX(2px)}
.rolecard .rc{width:26px;height:26px;border-radius:6px;background:var(--brand-lt);color:var(--brand-dk);
              display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex:0 0 auto}
.rolecard .t{display:block;font-size:12.5px;font-weight:700}
.rolecard .s{display:block;font-size:11px;color:var(--ink-3);margin-top:1px;line-height:1.35}
.rolecard .mfa{font-size:9.5px;font-weight:700;color:var(--warn);background:var(--warn-bg);
               padding:2px 5px;border-radius:4px;margin-left:auto;flex:0 0 auto;white-space:nowrap}
.otp{display:flex;gap:7px;margin:14px 0 4px}
.otp input{width:44px;height:52px;text-align:center;font-size:20px;font-weight:700;
           border:1px solid var(--line);border-radius:8px;font-family:ui-monospace,monospace}
.otp input:focus{outline:2px solid var(--brand);border-color:var(--brand)}
@media (max-width:760px){ .authbox{grid-template-columns:1fr} .authR{border-left:none;border-top:1px solid var(--line)} }

svg .gl{stroke:#f1f5f9;stroke-width:1}
svg text{font-size:10px;fill:var(--ink-3)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto}
  nav{display:flex;flex-wrap:wrap;padding:6px}
  nav .grp{width:100%}
  main{padding:16px}
}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================================================
   Data extracted from the client's own workbook.
   Free-text customer/CS notes are redacted; see scripts/extract_data.py
   ============================================================ */
const DATA = /*__DATA__*/;

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const egp = n => (n==null||isNaN(n)) ? '—' : Math.round(n).toLocaleString('en-US');
const mn  = n => (n==null||isNaN(n)) ? '—' : (n/1e6).toFixed(1)+'M';
const pct = n => (n==null||isNaN(n)) ? '—' : (n*100).toFixed(1)+'%';
const uniq = a => [...new Set(a.filter(Boolean))].sort();

/* ---------- session & role model (proposal §5.7) ---------- */
const ROLES = {
  'super-admin': { label:'Super Admin', person:'Ahmed Ezz',   email:'admin@marketplace.eg',
                   twoFactor:true,  home:'dashboard',
                   blurb:'Full operations plus platform configuration' },
  'ops':         { label:'Ops Manager', person:'Mahmoud S.',  email:'ops@marketplace.eg',
                   twoFactor:false, home:'dashboard',
                   blurb:'Orders, shipping, returns, vendor penalties' },
  'cs':          { label:'CS Agent',    person:'Nada H.',     email:'cs@marketplace.eg',
                   twoFactor:false, home:'orders',
                   blurb:'Confirm and cancel items, approve returns, recall queue' },
  'qc':          { label:'QC / Warehouse', person:'Maryam A.', email:'qc@marketplace.eg',
                   twoFactor:false, home:'approvals',
                   blurb:'Product approval and physical return inspection' },
  'finance':     { label:'Finance',     person:'Galal M.',    email:'finance@marketplace.eg',
                   twoFactor:true,  home:'financial',
                   blurb:'Settlements, refunds, reconciliation, margin' },
  'vendor':      { label:'Vendor',      person:'Onda Trading', email:'hello@onda.eg',
                   twoFactor:false, home:'v/dashboard',
                   blurb:'Own orders, stock, payouts and score card' },
};

/* S.user is the signed-in session; S.pending holds a role awaiting its 2FA code. */
const S = { user:null, pending:null, filters:{} };
const ROWS = DATA.seed;
const M = DATA.metrics;

/* Derived: group seed rows into customer orders so item-level splitting is visible */
const ORDERS = (()=>{
  const map = new Map();
  ROWS.forEach((r,i)=>{
    // 162 of 600 sampled rows have no Customer Order value but do carry a Vendor
    // Order — one of the data-quality gaps the new system removes. Fall back so
    // the row is still groupable rather than dropping it.
    r.orderRef = r.customerOrder || r.vendorOrder || '#unknown';
    const key = r.orderRef.split('-')[0];
    if(!map.has(key)) map.set(key,{ref:key,date:r.orderDate,items:[]});
    const o = map.get(key);
    r._id = i;
    r._itemRef = key.replace('#','') + '-' + (o.items.length+1);
    o.items.push(r);
  });
  return [...map.values()];
})();
const ORDER_BY_REF = new Map(ORDERS.map(o=>[o.ref,o]));

const statusPill = s => {
  const m = {'Delivered':'ok','Out for Delivery':'info','FD Allow Open Shipment':'bad','RTO':'bad',
             'Returned':'warn','Under Return':'warn','Cancelled':'mute','Pending':'mute','Ready To Shipped':'info'};
  return `<span class="pill ${m[s]||'mute'}">${esc(s||'—')}</span>`;
};

/* ---------- tiny SVG charts (no libraries) ---------- */
function barChart(data,{w=560,h=190,pad=30,color='var(--brand)',fmt=egp}={}){
  if(!data.length) return '<div class="empty">No data</div>';
  const max = Math.max(...data.map(d=>d.v))||1;
  const bw = (w-pad*2)/data.length;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img">
    ${[0,.25,.5,.75,1].map(t=>`<line class="gl" x1="${pad}" x2="${w-8}" y1="${18+(h-52)*t}" y2="${18+(h-52)*t}"/>`).join('')}
    ${data.map((d,i)=>{
      const bh=Math.max(2,(d.v/max)*(h-52)), x=pad+i*bw+bw*0.18, y=h-34-bh;
      return `<rect x="${x}" y="${y}" width="${bw*0.64}" height="${bh}" fill="${d.color||color}" rx="2"><title>${esc(d.k)}: ${fmt(d.v)}</title></rect>
              <text x="${x+bw*0.32}" y="${h-20}" text-anchor="middle">${esc(d.k)}</text>
              <text x="${x+bw*0.32}" y="${y-4}" text-anchor="middle" style="font-size:9px">${fmt(d.v)}</text>`;
    }).join('')}
  </svg>`;
}
function lineChart(data,{w=560,h=190,pad=34}={}){
  if(data.length<2) return '<div class="empty">No data</div>';
  const max=Math.max(...data.map(d=>d.v))*1.1||1, min=0;
  const X=i=>pad+i*((w-pad-12)/(data.length-1));
  const Y=v=>h-32-((v-min)/(max-min))*(h-52);
  const pts=data.map((d,i)=>`${X(i)},${Y(d.v)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img">
    ${[0,.25,.5,.75,1].map(t=>`<line class="gl" x1="${pad}" x2="${w-8}" y1="${18+(h-52)*t}" y2="${18+(h-52)*t}"/>`).join('')}
    <polyline points="${pts}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>
    ${data.map((d,i)=>`<circle cx="${X(i)}" cy="${Y(d.v)}" r="3.5" fill="var(--brand)"><title>${esc(d.k)}: ${d.v}</title></circle>
      <text x="${X(i)}" y="${h-14}" text-anchor="middle">${esc(d.k)}</text>`).join('')}
  </svg>`;
}
function hbars(data,{fmt=egp,color='var(--brand)'}={}){
  const max=Math.max(...data.map(d=>d.v))||1;
  return `<table>${data.map(d=>`<tr>
    <td style="width:34%">${esc(d.k)}</td>
    <td style="width:46%"><div class="bar"><i style="width:${(d.v/max*100).toFixed(1)}%;background:${d.color||color}"></i></div></td>
    <td class="num" style="width:20%">${fmt(d.v)}</td></tr>`).join('')}</table>`;
}

/* ---------- page chrome ---------- */
function head(title,sub,req,phase){
  return `<div class="top"><div>
    <h2>${esc(title)}</h2>
    <div class="sub">${sub}</div>
    <div class="tags">${(req||[]).map(r=>`<span class="req">§${esc(r)}</span>`).join('')}
      ${phase?`<span class="ph ${phase.toLowerCase().replace('.','')}">${esc(phase)}</span>`:''}</div>
  </div></div>`;
}

/* ---------- navigation, filtered by role ----------
   Each entry is [route, icon, label, rolesAllowed]. This is the single source of
   truth for both the sidebar and the router guard, so a link can never appear
   that the guard would then refuse. Derived from the RBAC matrix in §5.7.        */
const ALL = ['super-admin','ops','cs','qc','finance'];
const NAV = [
  ['Operations', [
    ['dashboard',        '◧','Executive Dashboard', ['super-admin','ops','cs','finance']],
    ['orders',           '▤','Orders',              ['super-admin','ops','cs','finance']],
    ['shipping',         '▶','Shipping & AWB',      ['super-admin','ops']],
    ['returns',          '↩','Returns & Exchanges', ['super-admin','ops','cs','qc']],
    ['returns-analytics','◔','Returns Analytics',   ['super-admin','ops']],
  ]],
  ['Finance', [
    ['financial',   '₤','Financial & P&L',   ['super-admin','finance']],
    ['settlements', '⇄','Vendor Settlements',['super-admin','finance']],
  ]],
  ['Catalogue', [
    ['inventory', '▦','Inventory',        ['super-admin','ops','qc']],
    ['vendors',   '◈','Vendors',          ['super-admin','ops']],
    ['approvals', '✓','Product Approvals',['super-admin','qc']],
  ]],
  ['System', [
    ['integrations','⇅','Integration Status',    ALL],
    ['audit',       '⊙','Audit Trail',           ['super-admin','ops','finance']],
    ['coverage',    '☰','Requirements Coverage', ALL],
  ]],
  ['Configuration', [
    ['admin/integrations','⚿','Integrations & Keys', ['super-admin']],
    ['admin/users',       '◍','Users & Access',      ['super-admin']],
    ['admin/roles',       '▩','Roles & Permissions', ['super-admin']],
    ['admin/rules',       '⚙','Business Rules',      ['super-admin']],
    ['admin/reports',     '▥','Reports',             ['super-admin']],
    ['admin/health',      '⚕','System Health',       ['super-admin']],
  ]],
  ['My Business', [
    ['v/dashboard','◧','Dashboard',   ['vendor']],
    ['v/orders',   '▤','My Orders',   ['vendor']],
    ['v/products', '▦','My Products', ['vendor']],
    ['v/scorecard','◔','Score Card',  ['vendor']],
    ['v/payouts',  '₤','Payouts',     ['vendor']],
    ['v/bank',     '◈','Bank Details',['vendor']],
  ]],
];

/* #/portal is the public customer returns portal and needs no session. */
const PUBLIC_ROUTES = ['login','portal'];

function allowed(route, role){
  if (PUBLIC_ROUTES.includes(route)) return true;
  if (!role) return false;
  if (route === 'order') return allowed('orders', role);   // drill-down inherits the list
  for (const [, items] of NAV)
    for (const [r,,,roles] of items) if (r === route) return roles.includes(role);
  return false;
}

function shell(content,route){
  const role = S.user.role, meta = ROLES[role];
  const groups = NAV
    .map(([g,items]) => [g, items.filter(([,,,roles]) => roles.includes(role))])
    .filter(([,items]) => items.length);

  return `<div class="app">
    <aside class="side">
      <div class="brand"><h1>OPS Management System</h1><p>Clickable prototype · v1.1</p></div>
      <div class="who">

      </div>
      <nav>
        ${groups.map(([g,items])=>`<div class="grp">${g}</div>`+
          items.map(([r,ic,label])=>`<a href="#/${r}" class="${route===r?'on':''}"><span class="ic">${ic}</span>${label}${
            r.startsWith('admin/rules')||r.startsWith('admin/reports')?'<span class="ph p1b" style="margin-left:auto">P1b</span>':''
          }</a>`).join('')
        ).join('')}
        <div class="grp">Customer-facing</div>
        <a href="#/portal" class="${route==='portal'?'on':''}"><span class="ic">◇</span>Returns Portal <span class="ph p1b" style="margin-left:auto">P1b</span></a>
      </nav>
      <div class="sidefoot">Seeded with ${ROWS.length} real item rows<br>from the client's workbook</div>
    </aside>
    <main>${content}</main>
  </div>`;
}

/* Shown when a signed-in user deep-links to a route their role cannot see. */
function refused(route){
  const meta = ROLES[S.user.role];
  return head('Access not permitted',
    `Your role does not include this screen. This is the RBAC matrix from proposal §5.7 being enforced, not an error.`,
    ['5.7','12.4'],'P1') + `
  <div class="card"><div class="body">
    <dl class="kv" style="max-width:520px">
      <dt>Signed in as</dt><dd>${esc(meta.person)} — ${esc(meta.label)}</dd>
      <dt>Requested screen</dt><dd class="mono">#/${esc(route)}</dd>
      <dt>Outcome</dt><dd><span class="pill bad">Refused</span></dd>
    </dl>
    <div class="note" style="margin-top:14px">The attempt is written to the audit trail with the user, timestamp and requested resource. Ask a Super Admin to grant the capability under <b>Roles &amp; Permissions</b>.</div>
    <p style="margin-top:14px"><a class="btn" href="#/${esc(ROLES[S.user.role].home)}">Go to my home screen</a></p>
  </div></div>`;
}

<script>
/* ============================================================
   SCREENS
   ============================================================ */
const V = {};

/* ---------------- Executive Dashboard ---------------- */
V.dashboard = () => {

  return head('Executive Dashboard',
    'Live operational and financial position across all channels, vendors and couriers.',
    ['11'],'P1') + `
  <div class="demo">Prototype seeded with <b>${ROWS.length} real item rows</b> sampled across Jan–Aug 2026. Headline figures below are the full-population values from all ${egp(t.item_rows)} rows.</div>
  <div class="grid g4" style="margin-bottom:16px">
    <div class="kpi"><div class="k">GMV</div><div class="v">${mn(t.gmv_egp)}</div><div class="d">EGP · 7 months</div></div>
    <div class="kpi"><div class="k">Items</div><div class="v">${egp(t.item_rows)}</div><div class="d">${egp(t.unique_customer_orders)} customer orders</div></div>
    <div class="kpi ${t.delivery_rate<0.6?'bad':'ok'}"><div class="k">Delivery rate</div><div class="v">${pct(t.delivery_rate)}</div><div class="d">${egp(t.delivered_items)} delivered</div></div>
    <div class="kpi bad"><div class="k">Failed / RTO</div><div class="v">${egp(6102)}</div><div class="d">≈ ${mn(6102*897)} EGP returned</div></div>
    <div class="kpi warn"><div class="k">Return rate</div><div class="v">${pct(t.return_rate)}</div><div class="d">${egp(t.return_or_rto_items)} items</div></div>
    <div class="kpi"><div class="k">Active vendors</div><div class="v">${t.vendors}</div><div class="d">${egp(t.exchange_items)} exchanges</div></div>
  </div>

  <div class="note d"><b>The headline problem.</b> ${egp(3743)} items failed delivery and ${egp(2359)} returned to origin — ${egp(6102)} in total, roughly <b>5.5M EGP of GMV</b> that shipped and came back. Only ${egp(1430)} (23%) were worked through the recall queue, recovering ${egp(273)} orders at a <b>19.1% recovery rate</b>. The other ${egp(4672)} were never worked. Systematising this queue is the single highest-value function of this system.</div>

  <div class="grid g2">
    <div class="card"><h3>Monthly item volume <span class="note">growth of ~90% Jan → Jun</span></h3>

    <div class="card"><h3>Monthly GMV <span class="note">EGP</span></h3>
      <div class="body">${barChart(months.map(m=>({k:m.month.slice(5),v:Math.round(m.gmv_egp/1000)})),{fmt:v=>v+'k'})}</div></div>
    <div class="card"><h3>Delivery outcome mix</h3><div class="body">${hbars([
        {k:'Delivered',v:9036,color:'var(--ok)'},
        {k:'Failed delivery',v:3743,color:'var(--bad)'},
        {k:'RTO',v:2359,color:'var(--bad)'},
        {k:'Cancelled',v:1307,color:'var(--ink-4)'},
        {k:'Returned',v:627,color:'var(--warn)'},
        {k:'In flight / unclassified',v:1269,color:'var(--ink-4)'},
      ],{fmt:v=>egp(v)+' items'})}</div></div>
    <div class="card"><h3>Delivery rate by vendor <span class="note">top 8 by volume</span></h3>
      <div class="body">${hbars(M.top_vendors.slice(0,8).map(v=>({
        k:v.vendor,v:Math.round(v.delivery_rate*1000)/10,
        color: v.delivery_rate>=0.6?'var(--ok)':v.delivery_rate<0.5?'var(--bad)':'var(--warn)'
      })),{fmt:v=>v+'%'})}
      <div class="note g" style="margin:12px 0 0"><b>Onda delivers 71%. Xo style delivers 45%</b> — on 2,897 items and 3.5M EGP of GMV. A 26-point spread that is invisible today without manual analysis.</div>
      </div></div>
  </div>`;
};

/* ---------------- Orders ---------------- */
V.orders = () => {
  const f = S.filters;
  let rows = ROWS.filter(r=>
    (!f.status || r.finalStatus===f.status) &&
    (!f.vendor || r.vendor===f.vendor) &&
    (!f.gov || r.governorate===f.gov) &&
    (!f.q || (r.orderRef+' '+r.sku+' '+(r.itemName||'')).toLowerCase().includes(f.q.toLowerCase()))
  );
  const shown = rows.slice(0,150);
  return head('Orders — item level',
    'Every row is one <b>item</b>, not one order. Each carries its own vendor, status, cost, margin and fulfilment flow. This replicates every column of the current Google Sheet.',
    ['1.1','2.1','2.2','4.2'],'P1') + `
  <div class="card">
    <div class="filters">
      <select data-f="status"><option value="">All statuses</option>${uniq(ROWS.map(r=>r.finalStatus)).map(s=>`<option ${f.status===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
      <select data-f="vendor"><option value="">All vendors</option>${uniq(ROWS.map(r=>r.vendor)).map(s=>`<option ${f.vendor===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
      <select data-f="gov"><option value="">All governorates</option>${uniq(ROWS.map(r=>r.governorate)).map(s=>`<option ${f.gov===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
      <input data-f="q" placeholder="Search order, SKU, item…" value="${esc(f.q||'')}">
      <button class="btn g sm" id="clearf">Clear</button>
      <span class="n">${rows.length} items${rows.length>150?' (showing 150)':''}</span>
    </div>
    <div class="tw"><table>
      <thead><tr><th>Order</th><th>Item ref</th><th>Date</th><th>Vendor</th><th>SKU</th><th>Item</th>
        <th class="num">Price</th><th class="num">Ship</th><th>Payment</th><th>Governorate</th>
        <th>Status</th><th>Reason</th><th>Stakeholder</th><th class="num">SLA</th></tr></thead>
      <tbody>${shown.map(r=>`<tr class="clk" data-order="${esc(r.orderRef.split('-')[0])}">
        <td class="mono">${esc(r.orderRef)}</td>
        <td class="mono" style="color:var(--brand);font-weight:600">${esc(r._itemRef)}</td>
        <td>${esc(r.orderDate)}</td>
        <td>${esc(r.vendor)}</td>
        <td class="mono">${esc(r.sku)}</td>
        <td><span class="trunc">${esc(r.itemName)}</span></td>
        <td class="num">${egp(r.itemPrice)}</td>
        <td class="num">${egp(r.shippingFees)}</td>
        <td>${esc((r.paymentMethod||'').replace('Cash on Delivery (COD)','COD'))}</td>
        <td>${esc(r.governorate||'—')}</td>
        <td>${statusPill(r.finalStatus)}</td>
        <td><span class="trunc" style="max-width:180px">${esc(r.reason||'—')}</span></td>
        <td>${esc(r.stakeholder||'—')}</td>
        <td class="num">${r.deliverySla==null?'—':r.deliverySla}</td>
      </tr>`).join('')}</tbody>
    </table></div>
    ${shown.length?'':'<div class="empty">No items match these filters.</div>'}
  </div>
  <div class="note"><b>Click any row</b> to open the order and see how a multi-vendor order splits into independently-tracked items.</div>`;
};

/* ---------------- Order detail ---------------- */
V.order = (ref) => {
  const o = ORDER_BY_REF.get('#'+ref) || ORDER_BY_REF.get(ref);
  if(!o) return head('Order not found','That order reference is not in the seeded sample.',['2.1'],'P1')+
    `<div class="card"><div class="empty">Try another order from the <a href="#/orders">Orders</a> list.</div></div>`;
  const total = o.items.reduce((s,i)=>s+(i.itemPrice||0)*(i.quantity||1),0);
  const ship = o.items.reduce((s,i)=>s+(i.shippingFees||0),0);
  const vendors = uniq(o.items.map(i=>i.vendor));
  const STAGES = ['New','Confirmed','Ready-To-Ship','Shipped','Delivered'];
  const stageOf = s => ({'Delivered':4,'Out for Delivery':3,'FD Allow Open Shipment':3,'RTO':3,
                         'Returned':4,'Under Return':4,'Cancelled':1,'Ready To Shipped':2,'Pending':0}[s] ?? 1);

  return head(`Order ${esc(o.ref)}`,
    `The customer sees <b>one order</b>. Internally it is ${o.items.length} independently-tracked item${o.items.length>1?'s':''} across ${vendors.length} vendor${vendors.length>1?'s':''}.`,
    ['2.1','2.2','12.2'],'P1') + `
  <div class="grid g4" style="margin-bottom:16px">
    <div class="kpi"><div class="k">Order value</div><div class="v">${egp(total)}</div><div class="d">EGP</div></div>
    <div class="kpi"><div class="k">Items</div><div class="v">${o.items.length}</div><div class="d">${vendors.length} vendor${vendors.length>1?'s':''}</div></div>
    <div class="kpi"><div class="k">Shipping</div><div class="v">${egp(ship)}</div><div class="d">EGP collected</div></div>
    <div class="kpi"><div class="k">Payment</div><div class="v" style="font-size:16px;padding:6px 0">${esc((o.items[0].paymentMethod||'—').replace('Cash on Delivery (COD)','COD'))}</div><div class="d">${esc(o.items[0].governorate||'')}</div></div>
  </div>
  ${vendors.length>1?`<div class="note g"><b>This is why item-level architecture matters.</b> These ${o.items.length} items come from ${vendors.length} different vendors. Each gets its own AWB, its own status and its own margin. An out-of-stock item from one vendor does not block the others from shipping.</div>`:''}

  ${o.items.map((r,ix)=>{
    const st = stageOf(r.finalStatus);
    const cancelled = r.finalStatus==='Cancelled';
    const margin = (r.itemPrice||0)*0.22;
    return `<div class="card">
      <h3><span class="mono" style="color:var(--brand)">${esc(r._itemRef)}</span>
          <span>${esc(r.itemName||'')}</span>
          ${statusPill(r.finalStatus)}
          <span class="note" style="margin-left:auto">Vendor: <b>${esc(r.vendor)}</b></span></h3>
      <div class="body">
        <div class="flow" style="margin-bottom:14px">
          ${STAGES.map((s,i)=>`<span class="st ${cancelled&&i>1?'':i<st?'done':i===st?'now':''}">${s}</span>${i<STAGES.length-1?'<span class="ar">→</span>':''}`).join('')}
          ${['Returned','Under Return'].includes(r.finalStatus)?'<span class="ar">→</span><span class="st now">Returned (WH)</span>':''}
          ${r.finalStatus==='RTO'?'<span class="ar">→</span><span class="st" style="background:var(--bad-bg);color:var(--bad)">RTO</span>':''}
          ${r.finalStatus==='FD Allow Open Shipment'?'<span class="ar">→</span><span class="st" style="background:var(--bad-bg);color:var(--bad)">Failed delivery</span>':''}
        </div>
        <div class="grid g3">
          <div><dl class="kv">
            <dt>SKU</dt><dd class="mono">${esc(r.sku)}</dd>
            <dt>Quantity</dt><dd>${r.quantity||1}</dd>
            <dt>Source</dt><dd>${esc(r.vendor)} stock</dd>
            <dt>AWB state</dt><dd>${esc(r.awbState||'—')}</dd>
            <dt>AWB created</dt><dd>${esc(r.awbCreatedAt||'—')}</dd>
          </dl></div>
          <div><dl class="kv">
            <dt>CS SLA</dt><dd>${r.csSla==null?'—':r.csSla+' d'}</dd>
            <dt>Pickup</dt><dd>${esc(r.pickupAt||'—')}</dd>
            <dt>First mile SLA</dt><dd>${r.fmSla==null?'—':r.fmSla+' d'}</dd>
            <dt>Delivered</dt><dd>${esc(r.deliveredAt||'—')}</dd>
            <dt>Delivery SLA</dt><dd>${r.deliverySla==null?'—':r.deliverySla+' d'}</dd>
          </dl></div>
          <div><dl class="kv">
            <dt>Selling price</dt><dd>${egp(r.itemPrice)}</dd>
            <dt>Shipping</dt><dd>${egp(r.shippingFees)}</dd>
            <dt>Vendor cost</dt><dd>${egp((r.itemPrice||0)*0.7)}</dd>
            <dt>Commission</dt><dd>${egp((r.itemPrice||0)*0.22)}</dd>
            <dt><b>Net margin</b></dt><dd><b style="color:var(--ok)">${egp(margin-(r.shippingFees||0)*0.5)}</b></dd>
          </dl></div>
        </div>
        ${r.reason?`<div class="note w" style="margin:14px 0 0"><b>${esc(r.reason)}</b> — attributed to <b>${esc(r.stakeholder||'unassigned')}</b>. ${r.recallStatus?`Recall status: <b>${esc(r.recallStatus)}</b>.`:''}</div>`:''}
        ${r.flexShip?`<div class="note" style="margin:10px 0 0">Bosta <b>${esc(r.flexShip)}</b> — compensation tracked against this item's effective shipping cost.</div>`:''}
      </div>
    </div>`;
  }).join('')}
  <div class="note"><b>Financial values are illustrative</b> in this prototype (commission modelled at 22%). In the built system each item carries an append-only financial snapshot so historical margins never change — proposal §5.2.2.</div>
  <p style="margin-top:14px"><a class="btn g" href="#/orders">← Back to orders</a></p>`;
};

/* ---------------- Shipping ---------------- */
V.shipping = () => {
  const pending = ROWS.filter(r=>['Pending','Ready To Shipped'].includes(r.finalStatus)||r.awbState==='Cancelled').slice(0,10);
  const active = ROWS.filter(r=>['Out for Delivery','FD Allow Open Shipment'].includes(r.finalStatus)).slice(0,25);
  const multi = ORDERS.filter(o=>o.items.length>1 && uniq(o.items.map(i=>i.vendor)).length>1).slice(0,1)[0];
  return head('Shipping & AWB',
    'Labels are generated <b>per item</b>, not per order. If only one item of three is available, only that item ships.',
    ['3.1','3.2','3.3','3.4','9'],'P1') + `
  <div class="grid g4" style="margin-bottom:16px">
    <div class="kpi"><div class="k">AWBs created</div><div class="v">${egp(12663)}</div><div class="d">of ${egp(18341)} items</div></div>
    <div class="kpi"><div class="k">Vendor-created</div><div class="v">${egp(3440)}</div><div class="d">via vendor portal</div></div>
    <div class="kpi warn"><div class="k">Flex ship applied</div><div class="v">${egp(3181)}</div><div class="d">141 rejected</div></div>
    <div class="kpi bad"><div class="k">In FD recovery</div><div class="v">${egp(3743)}</div><div class="d">awaiting recall</div></div>
  </div>

  ${multi?`<div class="card"><h3>Per-item AWB creation <span class="note">order ${esc(multi.ref)} — ${multi.items.length} items, ${uniq(multi.items.map(i=>i.vendor)).length} vendors</span> <span class="req" style="margin-left:auto">§3.2</span></h3>
  <div class="body">
    <div class="tw"><table>
      <thead><tr><th>Item ref</th><th>Vendor</th><th>Item</th><th>Status</th><th>Courier</th><th>AWB</th><th>Action</th></tr></thead>
      <tbody>${multi.items.map((r,i)=>`<tr>
        <td class="mono" style="color:var(--brand);font-weight:600">${esc(r._itemRef)}</td>
        <td>${esc(r.vendor)}</td><td><span class="trunc">${esc(r.itemName)}</span></td>
        <td>${statusPill(r.finalStatus)}</td>
        <td><select style="padding:4px 7px;border:1px solid var(--line);border-radius:5px;font-size:12px"><option>Bosta</option><option>Courier 2 (Phase 2)</option></select></td>
        <td class="mono">${r.awbState==='Cancelled'?'—':'BST'+(3900000+r._id)}</td>
        <td>${r.awbState==='Cancelled'
            ?'<button class="btn sm">Create AWB</button>'
            :'<button class="btn g sm">Print label</button> <button class="btn g sm">Switch courier</button>'}</td>
      </tr>`).join('')}</tbody></table></div>
    <div class="note g" style="margin:14px 0 0"><b>Each item is independently shippable.</b> Creating a label for one item does not force the others to ship. On creation the PDF is pushed to the vendor's dashboard and emailed automatically — requirement §9, replacing the current manual WhatsApp process.</div>
  </div></div>`:''}

  <div class="card"><h3>Live shipment tracking <span class="note">status arrives by Bosta webhook, not manual refresh</span> <span class="req" style="margin-left:auto">§3.3</span></h3>
    <div class="tw"><table>
      <thead><tr><th>Item ref</th><th>Order</th><th>Vendor</th><th>AWB</th><th>Governorate</th><th>Area</th><th>Status</th><th class="num">SLA</th><th>Flex ship</th></tr></thead>
      <tbody>${active.map(r=>`<tr>
        <td class="mono" style="color:var(--brand)">${esc(r._itemRef)}</td>
        <td class="mono">${esc(r.orderRef)}</td><td>${esc(r.vendor)}</td>
        <td class="mono">BST${3900000+r._id}</td>
        <td>${esc(r.governorate||'—')}</td><td>${esc(r.area||'—')}</td>
        <td>${statusPill(r.finalStatus)}</td>
        <td class="num">${r.deliverySla==null?'—':r.deliverySla+' d'}</td>
        <td>${r.flexShip?`<span class="pill ${r.flexShip.includes('Apply')?'ok':'bad'}">${esc(r.flexShip)}</span>`:'—'}</td>
      </tr>`).join('')}</tbody></table></div>
  </div>

  <div class="note w"><b>Flex shipping (§3.4).</b> ${egp(3181)} items carried an Apply FlexShip compensation over 7 months — roughly 15 per working day, reconciled by hand today against Bosta statements. The system detects these automatically and appends a new financial snapshot rather than editing the original.</div>`;
};

/* ---------------- Returns console ---------------- */
V.returns = () => {
  const returns = ROWS.filter(r=>['Returned','Under Return','RTO'].includes(r.finalStatus)||r.returnRequestedAt).slice(0,30);
  const q = {requested:9,approved:14,pickup:11,qc:6};
  return head('Returns & Exchanges — in-house console',
    'Replaces the third-party E-stebdal app. The OPS system is the <b>system of record</b> for returns and writes outcomes into Shopify — not the other way round.',
    ['5','8.7'],'P1') + `
  <div class="note g"><b>Why in-house.</b> E-stebdal publishes no public API, so an integration would have been reverse-engineered and fragile — the most likely component to break under Black Friday load. Returns are not an edge case here: <b>${egp(M.totals.return_or_rto_items)} items (${pct(M.totals.return_rate)})</b> pass through a return or RTO path.</div>

  <div class="grid g4" style="margin-bottom:16px">
    <div class="kpi"><div class="k">Awaiting CS review</div><div class="v">${q.requested}</div><div class="d">requests</div></div>
    <div class="kpi"><div class="k">Approved</div><div class="v">${q.approved}</div><div class="d">awaiting pickup</div></div>
    <div class="kpi"><div class="k">Under return (3PL)</div><div class="v">${q.pickup}</div><div class="d">in reverse transit</div></div>
    <div class="kpi warn"><div class="k">Awaiting warehouse QC</div><div class="v">${q.qc}</div><div class="d">received, not inspected</div></div>
  </div>

  <div class="card"><h3>Return workflow <span class="note">scenario 3 from the requirements</span></h3><div class="body">
    <div class="flow">
      <span class="st done">Return Request</span><span class="ar">→</span>
      <span class="st done">Eligibility check</span><span class="ar">→</span>
      <span class="st done">Confirm Return (CS)</span><span class="ar">→</span>
      <span class="st now">Ready-To-Pick</span><span class="ar">→</span>
      <span class="st">Under Return (3PL)</span><span class="ar">→</span>
      <span class="st">Returned (WH)</span><span class="ar">→</span>
      <span class="st">QC</span><span class="ar">→</span>
      <span class="st">Refund + vendor reversal</span>
    </div>
  </div></div>

  <div class="card"><h3>Eligibility engine <span class="note">per-vendor rules, editable without a deployment</span> <span class="req" style="margin-left:auto">§5</span></h3><div class="body">
    <div class="tw"><table>
      <thead><tr><th>Vendor</th><th class="num">Return window</th><th>Exchange allowed</th><th>Excluded categories</th><th>Return rate</th></tr></thead>
      <tbody>${M.top_vendors.slice(0,6).map((v,i)=>`<tr>
        <td><b>${esc(v.vendor)}</b></td>
        <td class="num">${[14,14,7,30,14,7][i]} days</td>
        <td>${i===2?'<span class="pill mute">No</span>':'<span class="pill ok">Yes</span>'}</td>
        <td>${i===3?'Intimates, Swimwear':'—'}</td>
        <td>${pct((v.rto+v.returned)/v.items)}</td>
      </tr>`).join('')}</tbody></table></div>
    <div class="note" style="margin:12px 0 0">Policies differ across all ${M.totals.vendors} vendors, so eligibility lives in a <span class="mono">return_policies</span> table rather than in code.</div>
  </div></div>

  <div class="card">
    <h3>Return &amp; exchange queue <span class="note">reason taxonomy ported verbatim — all 56 values with stakeholder attribution</span></h3>
    <div class="tw"><table>

<script>
/* ============================================================
   ROUTER
   ============================================================ */
function render(){
  const hash = (location.hash||'#/login').slice(2);
  const arg  = hash.startsWith('order/') ? hash.slice(6) : null;
  const route = hash.replace(/^order\/.*/,'order') || 'login';

  /* --- unauthenticated: only the login flow and the public returns portal --- */
  if(!S.user){
    if(route==='portal'){ $('#root').innerHTML = V.portal(); wire(); return; }
    $('#root').innerHTML = S.pending ? V.twofactor() : V.login();
    window.scrollTo(0,0); wire(); return;
  }

  /* --- signed in, but asked for the login screen: send them home --- */
  if(route==='login'){ location.hash = '#/'+ROLES[S.user.role].home; return; }

  /* --- guard: a role may only open the routes its NAV entries allow --- */
  if(!allowed(route, S.user.role)){
    $('#root').innerHTML = shell(refused(route), route);
    window.scrollTo(0,0); wire(); return;
  }

  const view = V[route];
  const html = view ? view(arg)
    : head('Not found','That screen does not exist in this prototype.',[],'')
      + '<div class="card"><div class="empty">Pick a screen from the sidebar.</div></div>';
  $('#root').innerHTML = route==='portal' ? V.portal() : shell(html,route);
  window.scrollTo(0,0);
  wire();
}

function signIn(role){
  if(ROLES[role].twoFactor){ S.pending = role; S.user = null; render(); return; }
  S.pending = null;
  S.user = { role, ...ROLES[role] };
  location.hash = '#/'+ROLES[role].home;
  render();
}

function wire(){
  /* login */
  document.querySelectorAll('[data-signin]').forEach(b=>b.onclick=()=>signIn(b.dataset.signin));
  const verify = $('#verify');
  if(verify) verify.onclick=()=>{
    const role = S.pending; S.pending = null;
    S.user = { role, ...ROLES[role] };
    location.hash = '#/'+ROLES[role].home;
    render();
  };
  const back = $('#backlogin');
  if(back) back.onclick=e=>{ e.preventDefault(); S.pending=null; render(); };
  /* auto-advance the OTP boxes so the flow feels real */
  const otp = [...document.querySelectorAll('[data-otp]')];
  otp.forEach((el,i)=>el.oninput=()=>{ el.value=el.value.replace(/\D/g,''); if(el.value&&otp[i+1]) otp[i+1].focus(); });
  if(otp.length) otp[0].focus();

  /* sign out */
  const so = $('#signout');
  if(so) so.onclick=()=>{ S.user=null; S.pending=null; S.filters={}; location.hash='#/login'; render(); };

  /* filters */
  document.querySelectorAll('[data-f]').forEach(el=>{
    const key=el.dataset.f;
    const handler=()=>{ S.filters[key]=el.value||''; render();
      const again=document.querySelector(`[data-f="${key}"]`); if(again && el.tagName==='INPUT'){ again.focus(); again.setSelectionRange(again.value.length,again.value.length); } };
    if(el.tagName==='INPUT'){ let t; el.oninput=()=>{clearTimeout(t);t=setTimeout(handler,260);}; }
    else el.onchange=handler;
  });
  const cf=$('#clearf'); if(cf) cf.onclick=()=>{ S.filters={}; render(); };

  /* table drill-downs */
  document.querySelectorAll('tr[data-order]').forEach(tr=>tr.onclick=()=>{
    location.hash='#/order/'+encodeURIComponent(tr.dataset.order.replace('#',''));
  });
  document.querySelectorAll('tr[data-goto]').forEach(tr=>tr.onclick=e=>{
    if(e.target.tagName==='A') return;
    location.hash='#/'+tr.dataset.goto;
  });
}

window.addEventListener('hashchange',render);
render();
</script>
